<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ALKON 3D Calc</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 16px; padding: 12px; outline: none; }
    input:focus { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .result-box { background: #022c22; border: 1px solid var(--accent); border-radius: 14px; padding: 16px; margin-top: 8px; }
    .res-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
    .res-row.total { border-top: 1px solid rgba(16, 185, 129, 0.3); padding-top: 10px; margin-top: 10px; font-size: 18px; font-weight: 700; color: #fff; }
    .tiers { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .tier-card { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; }
    .tier-title { font-size: 11px; color: var(--muted); }
    .tier-val { font-size: 15px; font-weight: 700; color: var(--accent); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ALKON 3D CALC</h1>
      <div class="subtitle">Калькулятор себестоимости печати</div>
    </header>

    <div class="card">
      <div class="field">
        <label>Цена катушки (₽/кг)</label>
        <input type="number" id="spool" value="1400" oninput="recalc()">
      </div>
      <div class="grid">
        <div class="field">
          <label>Вес детали (г)</label>
          <input type="number" id="weight" value="100" oninput="recalc()">
        </div>
        <div class="field">
          <label>Время печати (ч)</label>
          <input type="number" id="time" step="0.1" value="4" oninput="recalc()">
        </div>
      </div>
      <div class="field">
        <label>Постобработка (минут)</label>
        <input type="number" id="post" value="0" oninput="recalc()">
      </div>
    </div>

    <div class="card">
      <h2 style="font-size: 16px; margin-bottom: 12px;">Итоги расчета</h2>
      <div class="res-row"><span>🧵 Пластик (+5% брак):</span><span id="cPlastic">0 ₽</span></div>
      <div class="res-row"><span>⚡ Электричество:</span><span id="cElec">0 ₽</span></div>
      <div class="res-row"><span>⚙️ Амортизация принтера:</span><span id="cDeprec">0 ₽</span></div>
      <div class="res-row"><span>🛠 Постобработка:</span><span id="cLabor">0 ₽</span></div>
      <div class="res-row total"><span>Себестоимость:</span><span id="cTotal" style="color: #34d399;">0 ₽</span></div>

      <div class="tiers">
        <div class="tier-card">
          <div class="tier-title">x2.0 (100%)</div>
          <div class="tier-val" id="t2">0 ₽</div>
        </div>
        <div class="tier-card">
          <div class="tier-title">x2.5 (150%)</div>
          <div class="tier-val" id="t25">0 ₽</div>
        </div>
        <div class="tier-card">
          <div class="tier-title">x3.0 (200%)</div>
          <div class="tier-val" id="t3">0 ₽</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = { powerW: 150, rate: 5.5, pCost: 65000, pLife: 3500, defect: 0.05, laborHour: 500 };
    function recalc() {
      const spool = parseFloat(document.getElementById('spool').value) || 0;
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const hours = parseFloat(document.getElementById('time').value) || 0;
      const post = parseFloat(document.getElementById('post').value) || 0;

      const pCost = (weight / 1000) * spool * (1 + CONFIG.defect);
      const eCost = (CONFIG.powerW / 1000) * hours * CONFIG.rate;
      const dCost = (CONFIG.pCost / CONFIG.pLife) * hours;
      const lCost = (post / 60) * CONFIG.laborHour;
      const total = pCost + eCost + dCost + lCost;

      document.getElementById('cPlastic').innerText = pCost.toFixed(2) + ' ₽';
      document.getElementById('cElec').innerText = eCost.toFixed(2) + ' ₽';
      document.getElementById('cDeprec').innerText = dCost.toFixed(2) + ' ₽';
      document.getElementById('cLabor').innerText = lCost.toFixed(2) + ' ₽';
      document.getElementById('cTotal').innerText = total.toFixed(2) + ' ₽';

      document.getElementById('t2').innerText = (total * 2).toFixed(0) + ' ₽';
      document.getElementById('t25').innerText = (total * 2.5).toFixed(0) + ' ₽';
      document.getElementById('t3').innerText = (total * 3).toFixed(0) + ' ₽';
    }
    recalc();
  </script>
</body>
</html>
